<div class="page-header">
  <div class="header-content">
    <h1 class="page-title">Inventario Tecnológico</h1>
    <p class="page-subtitle">Gestiona componentes, laptops y periféricos</p>
  </div>
  
  <button class="btn-primary" (click)="abrirModalCrear()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
    </svg>
    Nuevo Componente
  </button>
</div>

<app-generic-table 
  [columns]="misColumnas" 
  [data]="misProductos" 
  [totalRecords]="245"
  (onEdit)="editarProducto($event)"
  (onToggleStatus)="confirmarCambioEstado($event)"
  (onExport)="exportarExcel()">
</app-generic-table>

@if (mostrarFormulario) {
  <app-product-form 
    [productToEdit]="productoSeleccionado" 
    (onClose)="cerrarModal()" 
    (onSave)="guardarProducto($event)">
  </app-product-form>
}
