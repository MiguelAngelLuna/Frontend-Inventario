<div class="modal-overlay" (click)="cerrar()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <h2>{{ productToEdit ? 'Editar Componente' : 'Nuevo Componente' }}</h2>
      <button class="btn-close" (click)="cerrar()">✕</button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label>Código *</label>
        <input type="text" [(ngModel)]="formData.codigo" placeholder="Ej. LAP-002">
      </div>

      <div class="form-group">
        <label>Nombre del Producto *</label>
        <input type="text" [(ngModel)]="formData.nombre" placeholder="Ej. Teclado Mecánico RGB">
      </div>

      <div class="form-group">
        <label>Categoría</label>
        <select [(ngModel)]="formData.categoria">
          <option value="" disabled selected>Selecciona una categoría</option>
          <option value="Laptops">Laptops</option>
          <option value="Componentes">Componentes</option>
          <option value="Monitores">Monitores</option>
          <option value="Periféricos">Periféricos</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Precio de Venta (S/) *</label>
          <input type="number" [(ngModel)]="formData.precio_venta" placeholder="0.00">
        </div>
        <div class="form-group">
          <label>Stock Inicial</label>
          <input type="number" [(ngModel)]="formData.stock" placeholder="0">
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="cerrar()">Cancelar</button>
      <button class="btn-save" (click)="guardar()">Guardar Producto</button>
    </div>

  </div>
</div>
