<div class="notification-dropdown">
  <div class="notif-header">
    <h3>Notificaciones</h3>
    <button class="btn-read-all" (click)="marcarComoLeidas()">Marcar leídas</button>
  </div>
  
  <div class="notif-body">
    @for (notif of misNotificaciones; track notif.id) {
      <div class="notif-item" [class.unread]="!notif.leido">
        
        <div class="notif-icon" [class]="'icon-' + notif.tipo">
          @if (notif.tipo === 'stock') {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3Z" /></svg>
          } @else if (notif.tipo === 'movimiento') {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" /></svg>
          } @else if (notif.tipo === 'precio') {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
          }
        </div>

        <div class="notif-content">
          <h4>{{ notif.titulo }}</h4>
          <p>{{ notif.mensaje }}</p>
          <span class="notif-time">{{ notif.tiempo }}</span>
        </div>
      </div>
    }
  </div>
  
  <div class="notif-footer">
    <a href="#" (click)="cerrarPanel()">Ver todo el historial</a>
  </div>
</div>
